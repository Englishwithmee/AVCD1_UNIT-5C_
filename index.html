const steps = [
  ['warm-up','Warm-up','Do the things you love','Talk about the things you do for fun. Then find out how a hobby can become a small business.'],
  ['flashcards','Flashcards','Meet the hobbies','Look at the photo and read the definition. Say your guess, then flip the card.'],
  ['vocabulary-practice','Vocabulary Practice','Practice the hobbies','Do the three Hobbies exercises on page 144. Tap or choose your answers.'],
  ['grammar','Grammar','Can and can’t','Talk about abilities, possibilities, and permission.'],
  ['grammar-practice','Grammar Practice','Put the rules to work','Apply the rules from Unit 5C and practice with the chart and signs on page 121.'],
  ['reading','Reading','Can a hobby earn money?','Read the article, check your understanding, and find examples of can and can’t.'],
  ['speaking','Speaking Task','Pitch your hobby','Talk to a partner about a hobby and how it could earn money.']
];
const nav = document.querySelector('#nav');
const page = document.querySelector('#page');
const taskData = {...bookTasks,...sourceTasks};
const taskStates = new Map();
const warmChoices = [null,null,null];
let stage = 0;
let cardIndex = 0;
let flipped = false;
let speakingChoice = 0;
let timerId;
let timerLeft = 60;
const ideas = [
  ['Baking','Sell cupcakes to local cafés.'],
  ['Taking photos','Offer to take photos at a school event.'],
  ['Making jewelry','Make bracelets and sell them online.'],
  ['Your own hobby','Choose any hobby and say what you can offer.']
];
const safe = text => String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const button = (text,action,style='') => '<button type="button" class="button '+style+'" data-action="'+action+'">'+text+'</button>';
const card = (title,body) => '<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const detail = (title,body) => '<details><summary>'+title+'</summary><div class="detail-text">'+body+'</div></details>';
const tile = (title,body) => '<div class="tile"><h3>'+title+'</h3><p>'+body+'</p></div>';
function stateFor(id) {
  if(!taskStates.has(id)) taskStates.set(id,{picks:taskData[id].map(()=>[]),checked:false,key:false});
  return taskStates.get(id);
}
function optionOrder(item,index,id) {
  const choices = [...item.choices];
  if(id==='vocab1' || id==='grammar7') return choices;
  // Keep distractors stable between visits while varying the position of the answer.
  const shift = index % choices.length;
  return [...choices.slice(shift),...choices.slice(0,shift)];
}
function quiz(id,title,instructions,{extra='',select=false,photo=false,offset=1}={}) {
  const state = stateFor(id);
  const questions = taskData[id].map((item,i)=>{
    const label = id+'-q'+i;
    const choices = optionOrder(item,i,id);
    const options = select
      ? '<select data-q="'+i+'" aria-labelledby="'+label+'"><option value="">Choose an answer</option>'+choices.map(choice=>'<option value="'+safe(choice)+'"'+(state.picks[i].includes(choice)?' selected':'')+'>'+safe(choice)+'</option>').join('')+'</select>'
      : '<div class="choices" role="group" aria-labelledby="'+label+'">'+choices.map(choice=>'<button type="button" class="choice" data-q="'+i+'" data-choice="'+safe(choice)+'" aria-pressed="'+state.picks[i].includes(choice)+'">'+safe(choice)+'</button>').join('')+'</div>';
    const picture = item.img?'<img src="'+item.img+'" alt="'+safe(item.alt)+'" loading="lazy">':'';
    const no = id==='reading'?(i===0?'2A':i):i+offset;
    const prompt = '<div class="q-top"><span class="number" aria-hidden="true">'+no+'</span><p id="'+label+'">'+safe(item.prompt)+'</p></div>';
    return '<div class="q'+(id==='grammar3'?' sign':'')+'">'+picture+prompt+(item.multiple?'<p class="hint">Choose all that match.</p>':'')+options+'<p class="feedback" hidden></p></div>';
  }).join('');
  return '<section class="quiz" data-quiz="'+id+'"><h2>'+title+'</h2><p class="description">'+instructions+'</p>'+extra+'<div class="questions '+(photo?'photo-questions':'')+'">'+questions+'</div><div class="actions">'+button('Check answers','check','primary')+button('Show answer key','key')+button('Reset','reset','quiet')+'</div><p class="score" aria-live="polite" aria-atomic="true"></p></section>';
}
function updateQuiz(section) {
  const id = section.dataset.quiz;
  const state = stateFor(id);
  let score = 0, answered = 0;
  section.querySelectorAll('.q').forEach((question,i)=>{
    const actual = state.picks[i];
    const expected = taskData[id][i].answer;
    const isCorrect = actual.length===expected.length && expected.every(answer=>actual.includes(answer));
    const show = state.checked && actual.length>0;
    score += Number(isCorrect);
    answered += Number(actual.length>0);
    question.classList.toggle('good',show && isCorrect);
    question.classList.toggle('bad',show && !isCorrect);
    const feedback = question.querySelector('.feedback');
    feedback.hidden = !state.key && !show;
    feedback.textContent = state.key?'Answer: '+expected.join(' · '):isCorrect?'Correct.':'Try again.';
  });
  section.querySelector('[data-action="key"]').textContent = state.key?'Hide answer key':'Show answer key';
  const count = state.picks.length;
  section.querySelector('.score').textContent = state.checked ? score+' of '+count+' correct.'+(answered<count?' '+(count-answered)+' unanswered.':'') : '';
}
function changePick(section,index,option,select=false) {
  const id = section.dataset.quiz;
  const state = stateFor(id);
  const actual = state.picks[index];
  const item = taskData[id][index];
  if(select) state.picks[index] = option?[option]:[];
  else if(actual.includes(option)) state.picks[index] = actual.filter(value=>value!==option);
  else state.picks[index] = item.multiple?[...actual,option]:[option];
  state.checked = false;
  section.querySelectorAll('button[data-q="'+index+'"]').forEach(choice=>choice.setAttribute('aria-pressed',state.picks[index].includes(choice.dataset.choice)));
  updateQuiz(section);
}
function flash() {
  const [word,definition] = hobbies[cardIndex];
  return '<div class="stack-area"><article class="stack"><img src="'+assets.hobbies[cardIndex]+'" alt="'+(flipped?safe(word):'Photo clue for hobby '+(cardIndex+1))+'"><div><span class="pill">'+(flipped?'THE HOBBY':'GUESS THE HOBBY')+'</span><h3 aria-live="polite">'+(flipped?safe(word):'What’s the hobby?')+'</h3><p class="definition">'+safe(definition)+'</p>'+button(flipped?'Show clue':'Flip to reveal','flip','primary')+'</div></article></div><div class="control-line deck-nav"><button type="button" class="button" data-action="back-card" '+(cardIndex===0?'disabled':'')+'>← Previous</button><span class="status">Card '+(cardIndex+1)+' of '+hobbies.length+'</span><button type="button" class="button" data-action="next-card" '+(cardIndex===hobbies.length-1?'disabled':'')+'>Next card →</button></div><progress value="'+(cardIndex+1)+'" max="'+hobbies.length+'" aria-label="Flashcard position"></progress>';
}
function warmup() {
  return card('Three quick questions','<p class="description">Tap your choice, then share your answer with a partner.</p><div class="questions">'+warmUps.map(({prompt,choices,follow},i)=>
    '<div class="q" data-warm="'+i+'"><div class="q-top"><span class="number" aria-hidden="true">'+(i+1)+'</span><p id="warm'+i+'">'+safe(prompt)+'</p></div><div class="choices" role="group" aria-labelledby="warm'+i+'">'+choices.map((choice,j)=>'<button type="button" class="choice" data-warm-option="'+j+'" aria-pressed="'+(warmChoices[i]===j)+'">'+safe(choice)+'</button>').join('')+'</div><p class="warm-follow" '+(warmChoices[i]===null?'hidden':'')+'>'+safe(follow)+'</p></div>'
  ).join('')+'</div>');
}
function abilityTable() {
  return '<div class="table-box"><table aria-label="What each person can do"><thead><tr><th scope="col">Activity</th>'+abilities.people.map(name=>'<th scope="col">'+name+'</th>').join('')+'</tr></thead><tbody>'+abilities.rows.map(([title,...values])=>'<tr><th scope="row">'+title+'</th>'+values.map(ok=>'<td class="'+(ok?'yes':'no')+'">'+(ok?'✓ Can':'✕ Can’t')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function grammar() {
  return card('Three ways to use can','<div class="tiles">'+tile('Ability','I <strong>can</strong> bake cakes.<br>She <strong>can’t</strong> play chess.')+tile('Possibility','You <strong>can</strong> make money from your hobby.<br>People <strong>can’t</strong> download the photos for free.')+tile('Permission','You <strong>can</strong> park here.<br>You <strong>can’t</strong> walk on the grass.')+'</div>')+
    card('How to form a sentence','<div class="forms"><div class="form"><strong>Affirmative</strong><span>She <b>can sew</b>.</span></div><div class="form"><strong>Negative</strong><span>She <b>can’t sew</b>.</span></div><div class="form"><strong>Question</strong><span><b>Can</b> she <b>sew</b>?</span></div><div class="form"><strong>Short answers</strong><span>Yes, she <b>can</b>. / No, she <b>can’t</b>.</span></div></div><p class="formula"><strong>can / can’t + base verb</strong>. Use the same form with every subject. <em>Cannot</em> is the full form of <em>can’t</em>.</p>');
}
function reading() {
  const photos = [null,...assets.reading.slice(0,4)];
  return card('Do the things you love','<div class="control-line read-controls"><span class="pill alt">MONEY MONTHLY</span>'+button('Show all Vietnamese translations','translate-all')+'</div><div class="passage">'+article.map(({name,en,vi},i)=>
    '<article class="story '+(photos[i]?'with-photo':'')+'">'+(photos[i]?'<img src="'+photos[i]+'" alt="" loading="lazy">':'')+'<div><h3>'+safe(i===0?'Introduction':name)+'</h3><p>'+safe(en)+'</p><button type="button" class="button" data-action="translate" aria-controls="translation-'+i+'" aria-expanded="false">Show Vietnamese translation</button><div class="translation" id="translation-'+i+'" lang="vi" hidden><p>'+safe(vi)+'</p></div></div></article>'
  ).join('')+'</div>');
}
function ideaPanel() {
  return '<p><strong>'+safe(ideas[speakingChoice][0])+'</strong></p><p>'+safe(ideas[speakingChoice][1])+'</p>';
}
function speakingContent() {
  return card('1 · Choose a hobby','<p class="description">Pick one idea to talk about, or use your own.</p><div class="choices" role="group" aria-label="Choose a hobby">'+ideas.map(([name],i)=>'<button type="button" class="choice" data-idea="'+i+'" aria-pressed="'+(speakingChoice===i)+'">'+safe(name)+'</button>').join('')+'</div><div class="talk-box" id="idea" aria-live="polite">'+ideaPanel()+'</div>')+
    card('2 · Give a one-minute pitch','<ol class="role-steps"><li>Say what the hobby is and why you enjoy it.</li><li>Explain what you <strong>can</strong> do or make.</li><li>Say one thing you <strong>can’t</strong> do yet.</li><li>Explain how you <strong>can</strong> make money from the hobby.</li></ol><div class="control-line"><output class="timer" id="timer" aria-label="Time left">1:00</output>'+button('Start timer','start','primary')+button('Reset timer','reset-timer')+'</div>'+
      detail('Show useful phrases','<p>My hobby is …<br>I enjoy it because …<br>I can …, but I can’t … yet.<br>I can make money by …</p>')+
      detail('Show a model answer','<p>My hobby is baking. I enjoy it because I can share cakes with my friends. I can make cupcakes, but I can’t decorate big cakes yet. I can make money by selling cupcakes to local cafés.</p>'))+
    card('3 · Ask a follow-up question','<p>Your partner asks one question. Then swap roles.</p><div class="tiles">'+tile('Question 1','Can you teach me how to do it?')+tile('Question 2','Where can you sell your products or services?')+tile('Question 3','What can you do to get better?')+'</div>');
}
function content() {
  switch(steps[stage][0]) {
    case 'warm-up': return warmup();
    case 'flashcards': return card('15 hobby flashcards','<div id="deck">'+flash()+'</div>');
    case 'vocabulary-practice':
      return quiz('vocab1','Exercise 1 · Match verbs to photos','Use the word bank. Some verbs are used more than once.',{extra:'<p class="description">'+verbs.join(' · ')+'</p>',photo:true,select:true})+
        quiz('vocab2','Exercise 2 · Match hobbies to descriptions','Choose the hobby or hobbies that match each description.')+
        quiz('vocab3','Exercise 3 · Complete the sentences','Choose the correct word or phrase.');
    case 'grammar': return grammar();
    case 'grammar-practice':
      return quiz('rules','Unit 5C · Exercise 4','Choose the correct words to complete the rules on page 45.')+
        quiz('grammar1','Grammar Practice · Exercise 1','Use the chart to choose can or can’t. Where there are two blanks, choose both words in order.',{extra:abilityTable()})+
        quiz('grammar2','Grammar Practice · Exercise 2','Choose the short answer that matches the chart.',{extra:abilityTable()})+
        quiz('grammar3','Grammar Practice · Exercise 3','Choose the sentence that matches each sign.',{photo:true,select:true})+
        quiz('grammar7','Unit 5C · Exercise 7A','Match each sentence with a heading from page 45.',{select:true});
    case 'reading':
      return quiz('read1','Before you read · Exercise 1','Match each activity with a photo from the article.',{photo:true,select:true})+
        reading()+
        quiz('reading','Reading Check · Exercises 2A and 2B','Choose answers based on the article.')+
        quiz('read3','Find the phrases · Exercise 3','Choose the phrase that completes each sentence from the article.');
    case 'speaking': return speakingContent();
  }
}
function render() {
  clearInterval(timerId);
  timerLeft = 60;
  stage = Math.max(0,steps.findIndex(([id])=>location.hash==='#'+id));
  const [id,label,title,subtitle] = steps[stage];
  nav.innerHTML = steps.map(([slug,name],i)=>'<a class="nav-link" href="#'+slug+'"'+(i===stage?' aria-current="page"':'')+'><span>'+String(i+1).padStart(2,'0')+'</span>'+name+'</a>').join('');
  const hero = '<section class="hero '+(id==='warm-up'?'intro-hero':id==='reading'||id==='speaking'?'accent':'')+'"><div><p class="eyebrow">UNIT 5C · '+label.toUpperCase()+'</p><h1 tabindex="-1">'+title+'</h1><p class="sub">'+subtitle+'</p></div>'+(id==='warm-up'?'<img class="hero-photo" src="'+assets.hobbies[7]+'" alt="A person making jewelry by hand">':'')+'</section>';
  const back = steps[stage-1], next = steps[stage+1];
  const arrows = '<div class="sequence">'+(back?'<a class="button" href="#'+back[0]+'">← '+back[1]+'</a>':'<span></span>')+(next?'<a class="button primary" href="#'+next[0]+'">'+next[1]+' →</a>':'<a class="button primary" href="#warm-up">Back to warm-up ↗</a>')+'</div>';
  page.innerHTML = hero+content()+arrows;
  page.querySelectorAll('[data-quiz]').forEach(updateQuiz);
}
function toggleTranslation(control,show) {
  const text = document.getElementById(control.getAttribute('aria-controls'));
  text.hidden = !show;
  control.setAttribute('aria-expanded',String(show));
  control.textContent = show?'Hide Vietnamese translation':'Show Vietnamese translation';
}
page.addEventListener('change',event=>{
  if(event.target.matches('select[data-q]')) changePick(event.target.closest('[data-quiz]'),Number(event.target.dataset.q),event.target.value,true);
});
page.addEventListener('click',event=>{
  const target = event.target.closest('button');
  if(!target) return;
  if(target.hasAttribute('data-warm-option')) {
    const group = target.closest('[data-warm]');
    warmChoices[Number(group.dataset.warm)] = Number(target.dataset.warmOption);
    group.querySelectorAll('button').forEach(control=>control.setAttribute('aria-pressed',control===target));
    group.querySelector('.warm-follow').hidden = false;
    return;
  }
  if(target.hasAttribute('data-idea')) {
    speakingChoice = Number(target.dataset.idea);
    page.querySelectorAll('[data-idea]').forEach(control=>control.setAttribute('aria-pressed',control===target));
    document.querySelector('#idea').innerHTML = ideaPanel();
    return;
  }
  const action = target.dataset.action;
  const section = target.closest('[data-quiz]');
  if(section) {
    if(target.hasAttribute('data-choice')) return changePick(section,Number(target.dataset.q),target.dataset.choice);
    const state = stateFor(section.dataset.quiz);
    if(action==='check') state.checked = true;
    if(action==='key') state.key = !state.key;
    if(action==='reset') {
      taskStates.delete(section.dataset.quiz);
      section.querySelectorAll('[data-choice]').forEach(control=>control.setAttribute('aria-pressed','false'));
      section.querySelectorAll('select').forEach(control=>control.value='');
    }
    updateQuiz(section);
  }
  if(['flip','back-card','next-card'].includes(action)) {
    if(action==='flip') flipped = !flipped;
    else {
      cardIndex += action==='next-card'?1:-1;
      flipped = false;
    }
    const deck = document.querySelector('#deck');
    deck.innerHTML = flash();
    const focus = deck.querySelector('[data-action="'+action+'"]');
    (focus.disabled?deck.querySelector('[data-action="flip"]'):focus).focus();
  }
  if(action==='translate'||action==='translate-all') {
    const controls = [...page.querySelectorAll('[data-action="translate"]')];
    if(action==='translate') toggleTranslation(target,target.getAttribute('aria-expanded')==='false');
    else {
      const show = controls.some(control=>control.getAttribute('aria-expanded')==='false');
      controls.forEach(control=>toggleTranslation(control,show));
    }
    const all = controls.every(control=>control.getAttribute('aria-expanded')==='true');
    page.querySelector('[data-action="translate-all"]').textContent = all?'Hide all Vietnamese translations':'Show all Vietnamese translations';
  }
  if(action==='start'||action==='reset-timer') {
    clearInterval(timerId);
    const start = page.querySelector('[data-action="start"]');
    const timer = page.querySelector('#timer');
    if(action==='reset-timer'||timerLeft===0) timerLeft = 60;
    const paint = () => timer.textContent = Math.floor(timerLeft/60)+':'+String(timerLeft%60).padStart(2,'0');
    paint();
    start.disabled = action==='start';
    start.textContent = action==='start'?'Timer running':'Start timer';
    if(action==='start') {
      const end = Date.now()+timerLeft*1000;
      timerId = setInterval(()=>{
        timerLeft = Math.max(0,Math.ceil((end-Date.now())/1000));
        paint();
        if(timerLeft===0) {
          clearInterval(timerId);
          timer.textContent = 'Time’s up!';
          start.textContent = 'Start again';
          start.disabled = false;
        }
      },200);
    }
  }
});
window.addEventListener('hashchange',()=>{
  if(location.hash==='#lesson') return;
  render();
  window.scrollTo(0,0);
  page.querySelector('h1').focus({preventScroll:true});
});
render();
